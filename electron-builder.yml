appId: com.tidy-desktop.app
productName: tidy-desktop
# 最大压缩：把安装包压进 Gitee 100MB 附件上限，使国内更新通道可用
compression: maximum
directories:
  output: release
files:
  - dist/**/*
  - build/icon-256.png
  - package.json
extraResources:
  - from: build/app-icon.ico
    to: build/app-icon.ico
win:
  icon: build/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 更新器为完整下载 + SHA256 校验，不使用 blockmap 增量下载；
  # 关闭差分包以解锁 maximum 压缩（差分模式会强制 normal 压缩）
  differentialPackage: false
  artifactName: ${productName}-Setup-${version}.${ext}
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/app-icon.ico
  uninstallerIcon: build/app-icon.ico
  installerHeaderIcon: build/app-icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: tidy-desktop
