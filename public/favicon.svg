<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="440" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8F1"/><stop offset="1" stop-color="#EDE7DA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#F2B419" stop-opacity=".32"/><stop offset="1" stop-color="#F2B419" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D9D2C2"/><stop offset="1" stop-color="#C9C1AD"/>
